# qDesktop 持续集成流水线
#
# 依据：specs/2026-10-08-project-scaffold/plan.md 任务组 6
#       specs/2026-10-08-project-scaffold/requirements.md 3.2（触发范围）
#       specs/tech-stack.md 2.6（CI 选型）
#
# 阶段 0 校验四件事：还原、构建（零警告）、测试（含覆盖率采集）、格式。
# 覆盖率仅采集不设阈值门禁；阈值于阶段 3 启用（requirements.md 3.3）。

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一分支的重复触发只保留最新一次，节省额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：本流水线只读仓库
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: qDesktop.sln
  BUILD_CONFIGURATION: Release
  # 覆盖率采集配置（限定采集范围为 qDesktop.Core）
  COVERLET_SETTINGS: tests/qDesktop.Core.Tests/coverlet.runsettings

jobs:
  build-test:
    name: 构建 / 测试 / 格式校验
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # CI 固定 SDK 版本以保证流水线输出可复现。
      # 本地不锁 SDK（不引入 global.json），依据 requirements.md 3.1。
      - name: 安装 .NET SDK 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 还原依赖
        run: dotnet restore $env:SOLUTION

      - name: 构建（警告即错误）
        run: dotnet build $env:SOLUTION --configuration $env:BUILD_CONFIGURATION --no-restore

      - name: 运行测试并采集覆盖率
        run: >
          dotnet test $env:SOLUTION
          --configuration $env:BUILD_CONFIGURATION
          --no-build
          --collect:"XPlat Code Coverage"
          --settings $env:COVERLET_SETTINGS
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: 校验代码格式
        run: dotnet format $env:SOLUTION --verify-no-changes --verbosity minimal

      - name: 上传测试结果与覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 14

      # ---------------------------------------------------------------------
      # 代码签名（占位，默认关闭）
      #
      # 首版不购买代码签名证书，改用 winget / Scoop 分发 + 文档说明 SmartScreen
      # 绕过路径。理由与重新评估触发条件见 specs/tech-stack.md 5.1。
      # 真实签名实现属阶段 17 范围（specs/roadmap.md 阶段 17 任务 7）。
      #
      # 启用方式：在仓库 Variables 中设置 ENABLE_CODE_SIGNING = true，
      #          并在 Secrets 中配置 SIGNING_CERTIFICATE_BASE64 /
      #          SIGNING_CERTIFICATE_PASSWORD。
      #
      # 注意：本步骤启用后**会失败**，这是刻意设计——防止把未实现的签名当作已完成。
      # ---------------------------------------------------------------------
      - name: 代码签名（默认关闭）
        if: ${{ vars.ENABLE_CODE_SIGNING == 'true' }}
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          Write-Error "代码签名尚未实现（阶段 17）。请勿在实现前启用 ENABLE_CODE_SIGNING。"
          exit 1
